spring:
  application:
    name: day3-consult-agent

  ai:
    openai:
      # 키는 소스에 넣지 않는다.  export OPENAI_API_KEY="sk-..."
      api-key: ${OPENAI_API_KEY:not-set}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.3
      embedding:
        options:
          model: text-embedding-3-small

    # 운영에서는 프롬프트 원문 로깅을 반드시 끈다(개인정보가 그대로 쌓인다).
    chat:
      observations:
        log-prompt: false
      client:
        observations:
          log-prompt: false

day3:
  rag:
    top-k: 4
    # 교재 대표 질문의 실측 점수: 반품 0.487, 교환 0.372, 배송 0.253.
    # 0.5는 정답 문서도 제외하므로 관련 문서를 살리고 배송 오탐을 거르는 0.3을 사용한다.
    threshold: 0.3
  memory:
    max: 20
  tool:
    max-calls: 5
  security:
    # 비밀번호는 소스에 기본값을 두지 않는다. 실행 전에 세 환경변수를 반드시 등록한다.
    user1-password: ${DAY3_USER1_PASSWORD}
    user2-password: ${DAY3_USER2_PASSWORD}
    admin-password: ${DAY3_ADMIN_PASSWORD}

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
    doc-expansion: none

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: day3-consult-agent

logging:
  level:
    com.skala.day3: DEBUG
    AI_TOOL_AUDIT: INFO
