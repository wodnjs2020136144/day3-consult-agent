spring:
  application:
    name: day3-consult-agent

  ai:
    openai:
      # 키는 소스에 넣지 않는다.  export OPENAI_API_KEY="sk-..."
      api-key: ${OPENAI_API_KEY:not-set}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.3
      embedding:
        options:
          model: text-embedding-3-small

    # 운영에서는 프롬프트 원문 로깅을 반드시 끈다(개인정보가 그대로 쌓인다).
    chat:
      observations:
        log-prompt: false
      client:
        observations:
          log-prompt: false

day3:
  rag:
    top-k: 4
    # 0.5는 text-embedding-3-small 코사인 유사도 기준 실제 정답 청크(약 0.48)보다 높아 전부
    # 걸러진다(실측·트러블슈팅 문서 참고). 0.35로 낮춰 관련 청크는 통과시키고 무관한 청크는
    # 걸러지는 균형점을 잡았다.
    threshold: 0.35
  memory:
    max: 20
  tool:
    max-calls: 5

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
    doc-expansion: none

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: day3-consult-agent

logging:
  level:
    com.skala.day3: DEBUG
    AI_TOOL_AUDIT: INFO
